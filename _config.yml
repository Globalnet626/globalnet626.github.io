permalink: /:year:month:day/:title
url: globalnet626.github.io
baseurl: /project

# variables
name: Gleebsalnet
description: Globalnet
google_verification: null


# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE"]

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Gallery folder. One markdown file in _gallery/ per photo.
# See assets/img/gallery/README.txt.
collections:
  gallery:
    output: true
    permalink: /gallery/:name/

defaults:
  - scope:
      type: gallery
    values:
      layout: photo
      photo: true

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable : true
