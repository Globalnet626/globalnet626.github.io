permalink: /:year:month:day/:title
url: globalnet626.github.io
baseurl: /project

# variables
name: Gleebsalnet
description: Globalnet
google_verification: null


# File management
include: [".htaccess"]
exclude: ["README.md", "LICENSE", "docs"]

# Sass
sass:
  style: :compressed
  sass_dir: _sass

# Public gallery images. Leave both blank to use the local placeholders
# in assets/img/gallery/. No keys belong here. See docs/gallery-r2.md.
# Example: https://photos.gleebsal.net
gallery_base_url: ""
# Optional. Relative thumb values use this, then gallery_base_url,
# then the local placeholder folder.
gallery_thumb_base_url: ""

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable : true
