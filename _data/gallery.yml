# Gallery catalog. The folder under (C:) lists these entries.
#
# Images load from gallery_base_url in _config.yml. A blank base URL
# serves `file` from assets/img/gallery/ instead.
#
# file     Path on the image host, or under assets/img/gallery/.
# url      Optional full image URL. Overrides file and gallery_base_url.
# thumb    Optional smaller image. A path is joined to the thumb base
#          URL, then gallery_base_url. The folder listing uses it.
# alt      Required. What is in the picture.
# caption  Name on the file and under the picture.
# tags     Optional list, such as [mecha]. Shown with the photo.
# taken    Optional date (2018-12-20) or ISO datetime
#          (2025-03-19T00:38:17). A date with no time is shown as a
#          date only. Leave it blank when unknown. Newest first.
# camera   Optional camera name, shown in the status bar.
# lens     Optional lens name. Left out of the status bar when it
#          is the same as the camera name.
# fstop    Optional aperture, such as 1.85. Shown as f/1.85.
# iso      Optional ISO number, such as 66. Shown as ISO 66.
# shutter  Optional shutter speed, such as 1/38. Shown as 1/38s.
# focal    Optional focal length in millimeters, such as 6.81.
# slug     Optional id used in the link. Defaults to the filename
#          without its extension.
#
# Cloudflare setup: docs/gallery-r2.md

