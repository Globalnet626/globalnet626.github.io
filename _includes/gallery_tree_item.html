{% include gallery_tags.html %}
<li class="tree-branch is-open">
	<button type="button" class="tree-toggle" aria-controls="gallery-tags" aria-expanded="true" aria-label="Collapse gallery"><i></i></button>
	<a class="gallery-root" href="/tag/gallery/" title="gallery"><img src="/assets/img/folder-pictures.png" alt="" />gallery</a>
	<ul id="gallery-tags">
		{% for gtag in gallery_tags %}
			{% if gtag.size > 0 %}
			<li><a href="/tag/gallery/#{{ gtag | slugify }}" title="{{ gtag | escape }}"><img src="/assets/img/folder.ico" alt="" />{{ gtag | escape }}</a></li>
			{% endif %}
		{% endfor %}
	</ul>
</li>
